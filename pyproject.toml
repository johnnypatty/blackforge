[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "blackforge-cli"
version = "0.2.0"
description = "An unofficial, safety-minded package navigator for the official BlackArch repository"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "BlackForge contributors" }]
keywords = ["blackarch", "arch-linux", "security-tools", "package-manager", "pacman"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/johnnypatty/blackforge"
Repository = "https://github.com/johnnypatty/blackforge"
BlackArch = "https://www.blackarch.org/"

[project.scripts]
blackforge = "blackforge.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
blackforge = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
