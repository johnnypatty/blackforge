name: Bug report
description: Report a reproducible BlackForge defect
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve BlackForge. Do not include credentials,
        access tokens, private targets, or data from systems you do not own.
  - type: input
    id: version
    attributes:
      label: BlackForge version
      description: Output of `blackforge version`
      placeholder: blackforge 0.3.0
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Arch/BlackArch version, kernel, architecture, and Python version
      placeholder: Arch Linux x86_64, Linux 6.x, Python 3.13
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and safe dry run
      description: Include the exact BlackForge command and its dry-run output when possible.
      render: shell
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: What happened, including the complete non-sensitive error.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened?
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I removed secrets and private target information.
          required: true
        - label: I searched existing issues for this problem.
          required: true
