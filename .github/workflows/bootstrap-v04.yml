name: Publish BlackForge v0.4.0

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap-v04.yml"
      - "packaging/arch/PKGBUILD"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: v0.4.0
      SOURCE_DATE_EPOCH: "1785542400"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Test and build the release
        run: |
          python -m pip install --upgrade pip build pytest ruff
          python -m pip install -e .
          ruff check .
          pytest
          python scripts/validate_community.py
          python scripts/build_site.py _site
          python scripts/check_site.py _site
          python scripts/check_release.py --tag "$RELEASE_TAG"
          version="${RELEASE_TAG#v}"
          tree="$(git show -s --format=%T "$GITHUB_SHA")"
          python -m build --wheel
          git archive \
            --format=tar \
            --prefix="blackforge_cli-${version}/" \
            --mtime="@${SOURCE_DATE_EPOCH}" \
            "$tree" \
            | gzip -n -9 > "dist/blackforge_cli-${version}.tar.gz"
          python scripts/check_release.py \
            --tag "$RELEASE_TAG" \
            --archive "dist/blackforge_cli-${version}.tar.gz"
          cd dist
          sha256sum blackforge_cli-* > SHA256SUMS
          cp "../docs/releases/${RELEASE_TAG}.md" RELEASE_NOTES.md
      - name: Create the tag and GitHub release once
        run: |
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "$RELEASE_TAG is already published"
            exit 0
          fi
          if ! git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG"; then
            git tag "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "$RELEASE_TAG"
          fi
          gh release create "$RELEASE_TAG" \
            dist/blackforge_cli-* \
            dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "BlackForge ${RELEASE_TAG#v}" \
            --notes-file dist/RELEASE_NOTES.md
