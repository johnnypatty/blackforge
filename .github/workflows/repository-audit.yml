name: BlackArch repository audit

on:
  workflow_dispatch:
  schedule:
    - cron: "43 6 * * 3"

permissions:
  contents: read

jobs:
  package-availability:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Audit every catalog package
        run: |
          python -m pip install --disable-pip-version-check .
          set +e
          blackforge --json status --all --remote --output blackforge-audit.json
          result=$?
          set -e
          if [ "$result" -ne 0 ] && [ "$result" -ne 3 ]; then
            exit "$result"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: blackforge-repository-audit
          path: blackforge-audit.json
