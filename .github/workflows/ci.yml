name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install --upgrade pip pytest ruff
      - run: python -m pip install -e .
      - run: ruff check .
      - run: pytest
      - run: python scripts/validate_community.py
      - run: python scripts/build_site.py _site
      - run: python scripts/check_site.py _site
      - run: python scripts/check_release.py
      - run: blackforge --version
      - run: blackforge search network mapper --limit 5
      - run: blackforge --json plan install arch:extra/nmap

  arch-linux-smoke:
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Arch prerequisites
        run: pacman -Syu --noconfirm python python-pip curl gnupg arch-audit
      - name: Install BlackForge with the Linux installer
        run: bash install.sh
      - name: Verify help, catalogs, maintenance, plans, and shell completion
        run: |
          "${HOME}/.local/bin/blackforge" --version
          "${HOME}/.local/bin/blackforge" help install | grep -q -- "--retries"
          "${HOME}/.local/bin/blackforge" names --prefix amas | grep -qx amass
          "${HOME}/.local/bin/blackforge" search nmap --source arch | grep -q nmap
          "${HOME}/.local/bin/blackforge" plan install arch:extra/nmap | grep -q "extra/nmap"
          "${HOME}/.local/bin/blackforge" maintenance summary | grep -q "recently_maintained"
          "${HOME}/.local/bin/blackforge" collection show network-discovery | grep -q nmap
          "${HOME}/.local/bin/blackforge" community show network-observation | grep -q nmap
          "${HOME}/.local/bin/blackforge" --json audit | grep -q '"vulnerable"'
          "${HOME}/.local/bin/blackforge" help --lang tr | grep -q "Turkce"
          "${HOME}/.local/bin/blackforge" completion bash | grep -q complete
      - name: Install and remove a curated official Arch tool
        run: |
          "${HOME}/.local/bin/blackforge" -y install arch:extra/nmap
          nmap --version
          pacman -Q nmap
          "${HOME}/.local/bin/blackforge" -y remove arch:extra/nmap
      - name: Enable BlackArch, install a package, and remove it
        run: |
          "${HOME}/.local/bin/blackforge" -y install --setup-repo 0trace
          pacman -Q 0trace
          "${HOME}/.local/bin/blackforge" -y remove 0trace
