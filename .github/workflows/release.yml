name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Keep the Python release archives reproducible across rebuilds.
      SOURCE_DATE_EPOCH: "1785542400"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Test the tagged source
        run: |
          python -m pip install --upgrade pip build pytest ruff
          python -m pip install -e .
          ruff check .
          pytest
          python scripts/check_release.py --tag "$GITHUB_REF_NAME"
      - name: Build reproducible release archives and checksums
        run: |
          version="${GITHUB_REF_NAME#v}"
          tree="$(git show -s --format=%T "$GITHUB_SHA")"
          python -m build --wheel
          git archive \
            --format=tar \
            --prefix="blackforge_cli-${version}/" \
            --mtime="@${SOURCE_DATE_EPOCH}" \
            "$tree" \
            | gzip -n -9 > "dist/blackforge_cli-${version}.tar.gz"
          python scripts/check_release.py \
            --tag "$GITHUB_REF_NAME" \
            --archive "dist/blackforge_cli-${version}.tar.gz"
          cd dist
          sha256sum blackforge_cli-* > SHA256SUMS
          cp "../docs/releases/${GITHUB_REF_NAME}.md" RELEASE_NOTES.md
      - name: Stage verified release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: blackforge-release
          path: |
            dist/blackforge_cli-*
            dist/SHA256SUMS
            dist/RELEASE_NOTES.md
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified release artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: blackforge-release
          path: dist
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/blackforge_cli-* \
            dist/SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "BlackForge ${GITHUB_REF_NAME#v}" \
            --notes-file dist/RELEASE_NOTES.md
