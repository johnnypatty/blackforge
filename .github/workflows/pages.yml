name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "community/**"
      - "docs/assets/**"
      - "src/blackforge/data/**"
      - "scripts/build_site.py"
      - "scripts/validate_community.py"
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "site/**"
      - "community/**"
      - "docs/assets/**"
      - "src/blackforge/data/**"
      - "scripts/build_site.py"
      - "scripts/validate_community.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validate community data and assemble the site
        run: |
          python -m pip install --disable-pip-version-check .
          python scripts/validate_community.py
          python scripts/build_site.py _site
          python scripts/check_site.py _site
      - name: Upload the verified site artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: blackforge-pages
          path: _site
          include-hidden-files: true
          if-no-files-found: error

  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: blackforge-pages
          path: _site
      - name: Publish the generated gh-pages branch
        run: |
          git fetch origin gh-pages
          git worktree add _deploy origin/gh-pages
          find _deploy -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a _site/. _deploy/
          cd _deploy
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          if git diff --cached --quiet; then
            echo "The published site is already current"
            exit 0
          fi
          git commit -m "docs: publish site for $GITHUB_SHA"
          git push origin HEAD:gh-pages
